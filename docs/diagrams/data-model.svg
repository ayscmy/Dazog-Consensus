<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Segoe UI',sans-serif">
<rect width="1200" height="720" fill="#ffffff"/><defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/>
  </marker>
</defs><text x="40" y="46" font-size="21" fill="#111827" font-weight="700" text-anchor="start">数据模型：单据顺着链路单向生长</text><text x="40" y="70" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">下游保留上游 id，改下游不回头改上游；每张单据都带 owner_id / org_id，权限就按这两个字段过滤</text><rect x="40" y="110" width="240" height="96" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/><text x="54" y="133" font-size="12.5" fill="#374151" font-weight="600" text-anchor="start">leads 线索</text><text x="54" y="150" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">status · owner_id</text><text x="54" y="167" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">转客户后保留来源</text><rect x="340" y="110" width="240" height="96" rx="10" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="354" y="133" font-size="12.5" fill="#111827" font-weight="600" text-anchor="start">accounts 客户</text><text x="354" y="150" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">name / tax_no / address</text><text x="354" y="167" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">owner_id · org_id</text><rect x="640" y="110" width="240" height="96" rx="10" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="654" y="133" font-size="12.5" fill="#111827" font-weight="600" text-anchor="start">opportunities 商机</text><text x="654" y="150" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">account_id · stage</text><text x="654" y="167" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">amount / win_rate</text><rect x="940" y="110" width="240" height="96" rx="10" fill="#fffbeb" stroke="#fcd9a0" stroke-width="1"/><text x="954" y="133" font-size="12.5" fill="#b45309" font-weight="600" text-anchor="start">quotations 报价</text><text x="954" y="150" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">no · status</text><text x="954" y="167" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">amount / discount_rate</text><text x="954" y="184" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">public_token 客户链接</text><rect x="940" y="268" width="240" height="96" rx="10" fill="#fffbeb" stroke="#fcd9a0" stroke-width="1"/><text x="954" y="291" font-size="12.5" fill="#b45309" font-weight="600" text-anchor="start">quotation_items 明细</text><text x="954" y="308" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">name / spec / unit / qty</text><text x="954" y="325" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">unit_price · is_custom</text><rect x="640" y="268" width="240" height="96" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/><text x="654" y="291" font-size="12.5" fill="#047857" font-weight="600" text-anchor="start">contracts 合同</text><text x="654" y="308" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">no：DD- 订单 / HT- 条款</text><text x="654" y="325" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">kind · tax_mode · amount</text><text x="654" y="342" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">items_json / clauses_json</text><rect x="340" y="268" width="240" height="96" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/><text x="354" y="291" font-size="12.5" fill="#047857" font-weight="600" text-anchor="start">invoices 发票</text><text x="354" y="308" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">contract_id · amount</text><text x="354" y="325" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">invoiced_at</text><rect x="40" y="268" width="240" height="96" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/><text x="54" y="291" font-size="12.5" fill="#047857" font-weight="600" text-anchor="start">payments 回款</text><text x="54" y="308" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">invoice_id · amount</text><text x="54" y="325" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">paid_at / method</text><path d="M280,158 L340,158" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><path d="M580,158 L640,158" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><path d="M880,158 L940,158" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><path d="M1060,206 L1060,268" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><path d="M940,316 L880,316" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><path d="M640,316 L580,316" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><path d="M340,316 L280,316" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><rect x="40" y="400" width="1120" height="104" rx="12" fill="#fcfcfd" stroke="#e8ecf1" stroke-width="1"/><text x="60" y="424" font-size="12" fill="#334155" font-weight="700" text-anchor="start">支撑表</text><rect x="60" y="438" width="172" height="54" rx="10" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="74" y="461" font-size="11.5" fill="#111827" font-weight="600" text-anchor="start">org_units 组织</text><text x="74" y="478" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">path / level</text><text x="74" y="495" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">集团 → 公司 → 部门 → 团队</text><rect x="244" y="438" width="172" height="54" rx="10" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="258" y="461" font-size="11.5" fill="#111827" font-weight="600" text-anchor="start">users 用户</text><text x="258" y="478" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">scrypt 密码 · status</text><text x="258" y="495" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">discount_limit 个人上限</text><rect x="428" y="438" width="172" height="54" rx="10" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="442" y="461" font-size="11.5" fill="#111827" font-weight="600" text-anchor="start">user_roles 角色</text><text x="442" y="478" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">user_id ↔ role</text><text x="442" y="495" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">一人可多角色</text><rect x="612" y="438" width="172" height="54" rx="10" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="626" y="461" font-size="11.5" fill="#111827" font-weight="600" text-anchor="start">handovers 交接</text><text x="626" y="478" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">left_at / handover_to</text><text x="626" y="495" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">离职时客户改派</text><rect x="796" y="438" width="172" height="54" rx="10" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="810" y="461" font-size="11.5" fill="#111827" font-weight="600" text-anchor="start">contract_templates</text><text x="810" y="478" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">条款 JSON + 占位符</text><text x="810" y="495" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">{{buyer.name}} 等</text><rect x="980" y="438" width="172" height="54" rx="10" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="994" y="461" font-size="11.5" fill="#111827" font-weight="600" text-anchor="start">settings 配置</text><text x="994" y="478" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">审批阈值、SMTP</text><text x="994" y="495" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">键值表，改完即时生效</text><rect x="40" y="524" width="1120" height="108" rx="12" fill="#fcfcfd" stroke="#e8ecf1" stroke-width="1"/><text x="60" y="548" font-size="12" fill="#334155" font-weight="700" text-anchor="start">旁挂表</text><text x="120" y="548" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">（target_type + target_id 指向任意一张单据，所以报价、合同、客户都能有审批与动态）</text><rect x="60" y="562" width="256" height="58" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/><text x="74" y="585" font-size="11.5" fill="#1d4ed8" font-weight="600" text-anchor="start">approvals 审批单</text><text x="74" y="602" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">type：price / contract</text><text x="74" y="619" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">status · current_step</text><rect x="332" y="562" width="256" height="58" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/><text x="346" y="585" font-size="11.5" fill="#1d4ed8" font-weight="600" text-anchor="start">approval_steps</text><text x="346" y="602" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">role · assignee_id</text><text x="346" y="619" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">decision · comment</text><rect x="604" y="562" width="256" height="58" rx="10" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="618" y="585" font-size="11.5" fill="#111827" font-weight="600" text-anchor="start">activities 业务动态</text><text x="618" y="602" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">type / content</text><text x="618" y="619" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">出现在单据时间线</text><rect x="876" y="562" width="256" height="58" rx="10" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="890" y="585" font-size="11.5" fill="#111827" font-weight="600" text-anchor="start">audit_logs 审计日志</text><text x="890" y="602" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">action / target / ip</text><text x="890" y="619" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">只增不改</text><text x="40" y="668" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">读图方式：箭头只表示「谁引用谁」，SQLite 未开强约束，外键由业务代码保证。</text><text x="40" y="690" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">报价有两个价格口径：amount 是成交价，discount_rate 是相对标准价的让价比例——审批只看后者。</text></svg>