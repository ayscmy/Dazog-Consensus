<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Segoe UI',sans-serif">
<rect width="1200" height="840" fill="#ffffff"/><defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/>
  </marker>
</defs><text x="40" y="46" font-size="21" fill="#111827" font-weight="700" text-anchor="start">审批链怎么长出来：先判断要不要审，再决定谁审，最后落到具体人</text><text x="40" y="70" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">阈值全部来自「系统设置 → 审批规则」，改配置不用改代码</text><rect x="40" y="90" width="300" height="74" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/><text x="54" y="113" font-size="12" fill="#1d4ed8" font-weight="600" text-anchor="start">提交单据</text><text x="54" y="130" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">报价：discount_rate（让价比例）</text><text x="54" y="147" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">合同：amount + payment_terms</text><path d="M190,164 L190,204" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><rect x="40" y="204" width="300" height="92" rx="10" fill="#fffbeb" stroke="#fcd9a0" stroke-width="1"/><text x="54" y="227" font-size="12" fill="#b45309" font-weight="600" text-anchor="start">报价：有没有让价？</text><text x="54" y="244" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">|rate| ≤ 0.000001 视为未让价</text><text x="54" y="261" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">开关 quote.skip_approval_when_no_discount</text><rect x="388" y="204" width="260" height="92" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/><text x="402" y="227" font-size="12" fill="#047857" font-weight="600" text-anchor="start">免价格审批</text><text x="402" y="244" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">status 直接 approved</text><text x="402" y="261" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">不生成审批单，直接进合同流</text><path d="M340,250 L388,250" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><text x="196" y="314" font-size="10.5" fill="#94a3b8" font-weight="400" text-anchor="start">有让价 ↓</text><rect x="40" y="336" width="300" height="76" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="56" y="366" font-size="13" fill="#111827" font-weight="700" text-anchor="start">≤ 5%</text><text x="56" y="386" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">approve.discount.manager</text><text x="56" y="402" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">也可给某个人单独设上限</text><rect x="388" y="336" width="300" height="76" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/><text x="402" y="359" font-size="12" fill="#1d4ed8" font-weight="600" text-anchor="start">部门经理一关</text><text x="402" y="376" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">一人批准即可放行</text><path d="M340,374 L388,374" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><rect x="40" y="428" width="300" height="76" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="56" y="458" font-size="13" fill="#111827" font-weight="700" text-anchor="start">5% &lt; x ≤ 10%</text><text x="56" y="478" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">超过经理阈值再上一关</text><text x="56" y="494" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">总监阈值默认 10%</text><rect x="388" y="428" width="300" height="76" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/><text x="402" y="451" font-size="12" fill="#1d4ed8" font-weight="600" text-anchor="start">经理 → 销售总监</text><text x="402" y="468" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">两关都通过才放行</text><path d="M340,466 L388,466" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><rect x="40" y="520" width="300" height="76" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="56" y="550" font-size="13" fill="#111827" font-weight="700" text-anchor="start">&gt; 10%</text><text x="56" y="570" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">再超过总监阈值</text><text x="56" y="586" font-size="10" fill="#5b6472" font-weight="400" text-anchor="start">直接到顶</text><rect x="388" y="520" width="300" height="76" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/><text x="402" y="543" font-size="12" fill="#1d4ed8" font-weight="600" text-anchor="start">经理 → 总监 → 总经理</text><text x="402" y="560" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">三关都通过才放行</text><path d="M340,558 L388,558" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><path d="M190,296 L190,336" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><rect x="40" y="636" width="300" height="88" rx="10" fill="#fffbeb" stroke="#fcd9a0" stroke-width="1"/><text x="54" y="659" font-size="12" fill="#b45309" font-weight="600" text-anchor="start">合同：金额与账期</text><text x="54" y="676" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">&gt; 50 万 或 账期 &gt; 30 天 → 加总监</text><text x="54" y="693" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">&gt; 100 万 或 &gt; 60 天 或 非标 → 加法务</text><rect x="388" y="636" width="300" height="88" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/><text x="402" y="659" font-size="12" fill="#1d4ed8" font-weight="600" text-anchor="start">经理 →（总监）→ 财务 →（法务）</text><text x="402" y="676" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">财务固定一关，其余按阈值出现</text><path d="M340,680 L388,680" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><rect x="748" y="204" width="412" height="104" rx="10" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="762" y="227" font-size="12" fill="#111827" font-weight="600" text-anchor="start">resolveChain：把角色变成具体的人</text><text x="762" y="244" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">沿组织树由近及远：本部门 → 上级部门 → 集团</text><text x="762" y="261" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">同组织优先；财务、法务这类职能角色全局兜底</text><path d="M688,374 L748,286" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><path d="M688,680 L748,330" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><rect x="748" y="340" width="412" height="96" rx="10" fill="#fffbeb" stroke="#fcd9a0" stroke-width="1"/><text x="762" y="363" font-size="12" fill="#b45309" font-weight="600" text-anchor="start">缺人就报错，不静默跳过</text><text x="762" y="380" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">返回 missing：哪个组织缺哪个角色</text><text x="762" y="397" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">提交方看到「销售二部缺销售总监」，而不是空转一圈</text><path d="M954,308 L954,340" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><rect x="748" y="468" width="412" height="96" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/><text x="762" y="491" font-size="12" fill="#1d4ed8" font-weight="600" text-anchor="start">提交时确定具体审批人，也可改派</text><text x="762" y="508" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">approverCandidates 按远近给出候选</text><text x="762" y="525" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">applyAssignees 校验：必须是该角色且在该范围</text><path d="M954,436 L954,468" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><rect x="748" y="596" width="412" height="96" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/><text x="762" y="619" font-size="12" fill="#047857" font-weight="600" text-anchor="start">逐关决策，全通过才放行</text><text x="762" y="636" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">approval_steps 一关一行，approve / reject 留意见</text><text x="762" y="653" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">报价通过 → approved；合同通过 → 推进下一状态</text><path d="M954,564 L954,596" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><rect x="40" y="762" width="1120" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="60" y="786" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">关键取舍：审批人是「算出来的」而不是「配出来的」。组织调整、人员离职后，新单据自动落到新负责人；</text><text x="60" y="806" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">历史单据仍指向当时的审批人，改派记录也留在 approval_steps 里。</text></svg>