<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="812" viewBox="0 0 1200 812" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Segoe UI',sans-serif">
<rect width="1200" height="812" fill="#ffffff"/><defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/>
  </marker>
</defs><text x="40" y="46" font-size="21" fill="#111827" font-weight="700" text-anchor="start">一次请求经过什么：会话 → 模块权限 → 数据范围 → 业务 → 脱敏 → 留痕</text><text x="40" y="70" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">权限不是入口处一个 if，而是分成「能不能进」「能看到谁的数据」「能不能改这一条」三件事</text><rect x="40" y="96" width="880" height="96" rx="12" fill="#ffffff" stroke="#e8ecf1" stroke-width="1"/><circle cx="78" cy="128" r="16" fill="#eff6ff" stroke="#bfdbfe"/><text x="78" y="133" font-size="13" fill="#1d4ed8" font-weight="700" text-anchor="middle">1</text><text x="110" y="133" font-size="14" fill="#111827" font-weight="700" text-anchor="start">会话校验</text><text x="110" y="156" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Cookie crm_sid → sessions 表 → 载入用户</text><text x="110" y="175" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">status 必须是 active，离职账号立即失效</text><rect x="936" y="122" width="224" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="948" y="149" font-size="11" fill="#475569" font-weight="400" text-anchor="start" font-family="Consolas,Menlo,monospace">auth.js  getSession / loadUser</text><path d="M480,192 L480,204" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><rect x="40" y="204" width="880" height="96" rx="12" fill="#fcfcfd" stroke="#e8ecf1" stroke-width="1"/><circle cx="78" cy="236" r="16" fill="#eff6ff" stroke="#bfdbfe"/><text x="78" y="241" font-size="13" fill="#1d4ed8" font-weight="700" text-anchor="middle">2</text><text x="110" y="241" font-size="14" fill="#111827" font-weight="700" text-anchor="start">模块权限</text><text x="110" y="264" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">角色映射到模块清单，* 表示全部</text><text x="110" y="283" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">can(module) 为假直接 403，不进入业务代码</text><rect x="936" y="230" width="224" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="948" y="257" font-size="11" fill="#475569" font-weight="400" text-anchor="start" font-family="Consolas,Menlo,monospace">auth.js  canModule</text><path d="M480,300 L480,312" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><rect x="40" y="312" width="880" height="96" rx="12" fill="#ffffff" stroke="#e8ecf1" stroke-width="1"/><circle cx="78" cy="344" r="16" fill="#eff6ff" stroke="#bfdbfe"/><text x="78" y="349" font-size="13" fill="#1d4ed8" font-weight="700" text-anchor="middle">3</text><text x="110" y="349" font-size="14" fill="#111827" font-weight="700" text-anchor="start">数据范围</text><text x="110" y="372" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">all → 1=1；org → 组织路径前缀匹配子树；self → owner_id = 我</text><text x="110" y="391" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">范围写成 SQL 片段拼进查询，而不是查出来再过滤</text><rect x="936" y="338" width="224" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="948" y="365" font-size="11" fill="#475569" font-weight="400" text-anchor="start" font-family="Consolas,Menlo,monospace">auth.js  scopeFilter</text><path d="M480,408 L480,420" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><rect x="40" y="420" width="880" height="96" rx="12" fill="#fcfcfd" stroke="#e8ecf1" stroke-width="1"/><circle cx="78" cy="452" r="16" fill="#eff6ff" stroke="#bfdbfe"/><text x="78" y="457" font-size="13" fill="#1d4ed8" font-weight="700" text-anchor="middle">4</text><text x="110" y="457" font-size="14" fill="#111827" font-weight="700" text-anchor="start">业务处理</text><text x="110" y="480" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">校验 → 事务 → 写库；跨单据动作走 service</text><text x="110" y="499" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">例如报价转合同：锁价、生成编号、复制明细</text><rect x="936" y="446" width="224" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="948" y="473" font-size="11" fill="#475569" font-weight="400" text-anchor="start" font-family="Consolas,Menlo,monospace">routes/* + contracts-service</text><path d="M480,516 L480,528" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><rect x="40" y="528" width="880" height="96" rx="12" fill="#ffffff" stroke="#e8ecf1" stroke-width="1"/><circle cx="78" cy="560" r="16" fill="#ecfdf5" stroke="#a7f3d0"/><text x="78" y="565" font-size="13" fill="#047857" font-weight="700" text-anchor="middle">5</text><text x="110" y="565" font-size="14" fill="#111827" font-weight="700" text-anchor="start">字段脱敏</text><text x="110" y="588" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">成本、毛利等字段服务端直接剔除</text><text x="110" y="607" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">客户版报价单接口从不查询成本列</text><rect x="936" y="554" width="224" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="948" y="581" font-size="11" fill="#475569" font-weight="400" text-anchor="start" font-family="Consolas,Menlo,monospace">routes/quotations.js</text><path d="M480,624 L480,636" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/><rect x="40" y="636" width="880" height="96" rx="12" fill="#fcfcfd" stroke="#e8ecf1" stroke-width="1"/><circle cx="78" cy="668" r="16" fill="#ecfdf5" stroke="#a7f3d0"/><text x="78" y="673" font-size="13" fill="#047857" font-weight="700" text-anchor="middle">6</text><text x="110" y="673" font-size="14" fill="#111827" font-weight="700" text-anchor="start">留痕与响应</text><text x="110" y="696" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">activities 记业务动作，audit_logs 记敏感操作</text><text x="110" y="715" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">统一 JSON，异常由入口层兜底成中文提示</text><rect x="936" y="662" width="224" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="948" y="689" font-size="11" fill="#475569" font-weight="400" text-anchor="start" font-family="Consolas,Menlo,monospace">db.js  activities / audit_logs</text><rect x="40" y="748" width="1120" height="62" rx="10" fill="#fffbeb" stroke="#fcd9a0" stroke-width="1"/><text x="60" y="772" font-size="12" fill="#b45309" font-weight="600" text-anchor="start">写权限是另一条线：canEditRecord(user, record) 判「本人 / 本组织子树 / 全集团」，与读范围共用同一套 scope</text><text x="60" y="794" font-size="11.5" fill="#92400e" font-weight="400" text-anchor="start">所以会出现「列表里别人看不见你的单，你也改不了别人的单」这种一致行为，而不是前端按钮藏起来、接口照样能调。</text></svg>