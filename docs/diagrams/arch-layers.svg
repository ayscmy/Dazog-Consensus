t-anchor="start">无打包、无 hash 文件名</text><rect x="616" y="212" width="208" height="62" rx="10" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="630" y="235" font-size="12" fill="#111827" font-weight="600" text-anchor="start">会话</text><text x="630" y="252" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Cookie crm_sid</text><text x="630" y="269" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">服务端 sessions 表</text><rect x="840" y="212" width="208" height="62" rx="10" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="854" y="235" font-size="12" fill="#111827" font-weight="600" text-anchor="start">统一出口</text><text x="854" y="252" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">异常 → JSON</text><text x="854" y="269" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">错误码与中文提示</text><rect x="168" y="336" width="96" height="30" rx="8" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="216" y="355" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">auth.js</text><rect x="270" y="336" width="96" height="30" rx="8" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="318" y="355" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">accounts.js</text><rect x="372" y="336" width="96" height="30" rx="8" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="420" y="355" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">opportunities.js</text><rect x="474" y="336" width="96" height="30" rx="8" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="522" y="355" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">quotations.js</text><rect x="576" y="336" width="96" height="30" rx="8" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="624" y="355" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">contracts.js</text><rect x="678" y="336" width="96" height="30" rx="8" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="726" y="355" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">approvals.js</text><rect x="780" y="336" width="96" height="30" rx="8" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="828" y="355" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">finance.js</text><rect x="882" y="336" width="96" height="30" rx="8" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="930" y="355" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">admin.js</text><rect x="984" y="336" width="96" height="30" rx="8" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="1032" y="355" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">setup.js</text><rect x="168" y="420" width="140" height="76" rx="10" fill="#fffbeb" stroke="#fcd9a0" stroke-width="1"/><text x="182" y="443" font-size="11.5" fill="#b45309" font-weight="600" text-anchor="start">approval.js</text><text x="182" y="460" font-size="10.5" fill="#5b6472" font-weight="400" text-anchor="start">阈值 → 审批链</text><text x="182" y="477" font-size="10.5" fill="#5b6472" font-weight="400" text-anchor="start">逐级找人、可改派</text><rect x="316" y="420" width="140" height="76" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/><text x="330" y="443" font-size="11.5" fill="#1d4ed8" font-weight="600" text-anchor="start">auth.js</text><text x="330" y="460" font-size="10.5" fill="#5b6472" font-weight="400" text-anchor="start">角色 + 数据范围</text><text x="330" y="477" font-size="10.5" fill="#5b6472" font-weight="400" text-anchor="start">记录级读写权限</text><rect x="464" y="420" width="140" height="76" rx="10" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="478" y="443" font-size="11.5" fill="#111827" font-weight="600" text-anchor="start">contracts-service.js</text><text x="478" y="460" font-size="10.5" fill="#5b6472" font-weight="400" text-anchor="start">合同创建与编号</text><text x="478" y=