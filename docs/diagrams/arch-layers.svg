</defs><text x="40" y="46" font-size="21" fill="#111827" font-weight="700" text-anchor="start">分层架构：一次页面操作穿过六层</text><text x="40" y="70" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="start">没有框架、没有构建步骤，每一层的边界都在文件名上</text><rect x="40" y="96" width="1040" height="88" rx="12" fill="#fcfcfd" stroke="#e8ecf1" stroke-width="1"/><text x="60" y="117" font-size="12" fill="#334155" font-weight="700" text-anchor="start">客户端</text><rect x="40" y="196" width="1040" height="88" rx="12" fill="#fcfcfd" stroke="#e8ecf1" stroke-width="1"/><text x="60" y="217" font-size="12" fill="#334155" font-weight="700" text-anchor="start">HTTP 入口</text><rect x="40" y="296" width="1040" height="92" rx="12" fill="#fcfcfd" stroke="#e8ecf1" stroke-width="1"/><text x="60" y="317" font-size="12" fill="#334155" font-weight="700" text-anchor="start">路由层</text><rect x="40" y="402" width="1040" height="112" rx="12" fill="#fcfcfd" stroke="#e8ecf1" stroke-width="1"/><text x="60" y="423" font-size="12" fill="#334155" font-weight="700" text-anchor="start">领域层</text><rect x="40" y="528" width="1040" height="88" rx="12" fill="#fcfcfd" stroke="#e8ecf1" stroke-width="1"/><text x="60" y="549" font-size="12" fill="#334155" font-weight="700" text-anchor="start">渲染层</text><rect x="40" y="640" width="1040" height="88" rx="12" fill="#fcfcfd" stroke="#e8ecf1" stroke-width="1"/><text x="60" y="661" font-size="12" fill="#334155" font-weight="700" text-anchor="start">数据层</text><rect x="168" y="112" width="208" height="62" rx="10" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/><text x="182" y="135" font-size="12" fill="#111827" font-weight="600" text-anchor="start">主系统 SPA</text><text x="182" y="152" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">/app.html#/…</text><text x="182" y="169" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">hash 路由 + 动态 import</text><rect x="392" y="112" width="208" height="62" rx="10" fill="#f8fafc" stroke="#dbe2ea" stroke-width="1"/